services:
  db:
    image: postgres:16-alpine
    container_name: gpt-images-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gpt_images}
      POSTGRES_USER: ${POSTGRES_USER:-gpt_images}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gpt_images_secure_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gpt_images} -d ${POSTGRES_DB:-gpt_images}"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 384M

  api:
    build:
      context: ../BE
      dockerfile: Dockerfile
    container_name: gpt-images-prod-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:87:8000"
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-gpt_images}
      POSTGRES_USER: ${POSTGRES_USER:-gpt_images}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gpt_images_secure_2026}
      DATABASE_URL: postgresql://${POSTGRES_USER:-gpt_images}:${POSTGRES_PASSWORD:-gpt_images_secure_2026}@db:5432/${POSTGRES_DB:-gpt_images}
      SECRET_KEY: ${SECRET_KEY:-gpt-images-secret-key-prod-2026}
      CORS_ORIGINS: http://localhost:86,http://gpt-images.nexoratech.com.vn,https://gpt-images.nexoratech.com.vn,http://127.0.0.1:86
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: ../FE
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api-gpt-images.nexoratech.com.vn/api/v1}
    container_name: gpt-images-prod-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:86:80"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
    name: gpt_images_prod_postgres_data
  uploads_data:
    name: gpt_images_prod_uploads_data
