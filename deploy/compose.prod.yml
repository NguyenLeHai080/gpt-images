services:
  api:
    build:
      context: ../BE
      dockerfile: Dockerfile
    container_name: gpt-images-prod-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8087:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_SERVER: host.docker.internal
      POSTGRES_PORT: 5432
      POSTGRES_DB: gpt_images
      POSTGRES_USER: gpt_images
      POSTGRES_PASSWORD: gpt_images_secure_2026
      DATABASE_URL: postgresql://gpt_images:gpt_images_secure_2026@host.docker.internal:5432/gpt_images
      SECRET_KEY: ${SECRET_KEY:-gpt-images-secret-key-prod-2026}
      CORS_ORIGINS: http://localhost:86,http://localhost:8087,http://gpt-images.local,http://gpt-images.localhost,http://api.gpt-images.local,http://api.gpt-images.localhost,http://127.0.0.1:86,http://127.0.0.1:8087,http://gpt-images.nexoratech.com.vn,https://gpt-images.nexoratech.com.vn
    volumes:
      - uploads_data:/app/uploads
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: ../FE
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: gpt-images-prod-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:86:80"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  uploads_data:
    name: gpt_images_prod_uploads_data
